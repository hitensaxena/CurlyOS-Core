[project]
name = "curlyos-core"
version = "0.1.0"
description = "CurlyOS Core — a memory system with a knowledge graph: bi-temporal memory, identity, cognition, goals"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Hiten Saxena"}]

dependencies = [
    "fastapi>=0.110",
    "pydantic>=2.0",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
mcp = [
    "mcp>=1.26,<2",
    "httpx>=0.27,<1",
]
postgres = [
    "psycopg[binary,pool]>=3.1",
    "pgvector>=0.3",
]
redis = [
    "redis>=5.0",
]
embeddings = [
    "sentence-transformers>=3.0",
]
reranker = [
    "sentence-transformers>=3.0",
]
llm = [
    "openai>=1.40",
]
all = [
    "curlyos-core[mcp,postgres,redis,embeddings,reranker,llm]",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-xdist>=3.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["memory", "knowledge", "identity", "cognition", "shared", "hermes_integration", "safety", "goals", "mcp_server"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint.per-file-ignores]
# Standalone operator scripts: they insert sys.path entries and only then
# import project modules, so their imports cannot sit at the top of the file.
"deploy/*.py" = ["E402"]
"hermes_smoketest.py" = ["E402"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
