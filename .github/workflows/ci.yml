name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      # Tests mock their DB pools (AsyncMock) — no service containers needed.
      # Heavy extras (embeddings/torch, neo4j) deliberately excluded.
      # `mcp` is needed by tests/test_mcp_bridge.py (FastMCP client needs httpx).
      - run: uv sync --extra dev --extra postgres --extra redis --extra mcp
      # Lint the whole tree, not one file — the previous target let 80+ errors
      # accumulate in every module the linter never looked at.
      - run: uv run ruff check .
      - run: uv run pytest -q

  # docs-deploy.yml only builds on main, so until this job existed a Dependabot
  # PR could bump Docusaurus/React/TypeScript and merge with nothing but pytest
  # to vouch for it — the breakage surfaced after the deploy, on the live site.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
        working-directory: docs
      - run: npm run build
        working-directory: docs
